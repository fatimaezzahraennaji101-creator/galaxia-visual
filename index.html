```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Universe</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #050014;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
  height: 100vh;
}

/* FONDO */
.universe {
  width: 100%;
  height: 100vh;
  position: relative;
  background:
    radial-gradient(circle at 50% 50%,
    #28105b 0%, #10052b 40%, #050014 100%);
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ESTRELLAS */
.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  box-shadow: 0 0 10px white;
  animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
  from { opacity: 0.2; transform: scale(.5); }
  to { opacity: 1; transform: scale(1.5); }
}

/* PORTAL */
.portal {
  position: relative;
  width: 250px;
  height: 250px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.ring {
  position: absolute;
  width: 100%;
  height: 100%;
  border: 3px solid #00eaff;
  border-radius: 50%;
  box-shadow: 0 0 20px #00eaff,
              inset 0 0 20px #00eaff;
  animation: rotate 5s linear infinite;
}

.ring.two {
  width: 75%;
  height: 125%;
  border-color: #d000ff;
  box-shadow: 0 0 25px #d000ff;
  animation-duration: 3s;
  animation-direction: reverse;
}

.ring.three {
  width: 125%;
  height: 75%;
  border-color: #ffffff;
  animation-duration: 7s;
}

.core {
  width: 85px;
  height: 85px;
  border-radius: 50%;
  background: radial-gradient(circle, white, #00eaff, #7300ff);
  box-shadow: 0 0 30px #00eaff,
              0 0 80px #a000ff;
  animation: pulse 2s infinite alternate;
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

@keyframes pulse {
  to { transform: scale(1.3); }
}

/* TEXTO */
.content {
  position: absolute;
  bottom: 12%;
  text-align: center;
}

h1 {
  font-size: clamp(30px, 7vw, 65px);
  letter-spacing: 10px;
  text-shadow: 0 0 15px #00eaff,
               0 0 35px #a000ff;
  animation: glow 2s infinite alternate;
}

p {
  margin-top: 15px;
  color: #00eaff;
  letter-spacing: 5px;
  font-size: 12px;
}

@keyframes glow {
  to {
    text-shadow: 0 0 30px #ff00ff,
                 0 0 60px #00eaff;
  }
}

/* METEORITOS */
.meteor {
  position: absolute;
  width: 3px;
  height: 90px;
  background: linear-gradient(white, transparent);
  box-shadow: 0 0 12px #00eaff;
  transform: rotate(45deg);
  animation: fall 2s linear forwards;
}

@keyframes fall {
  from {
    opacity: 1;
    transform: translate(0, 0) rotate(45deg);
  }
  to {
    opacity: 0;
    transform: translate(250px, 250px) rotate(45deg);
  }
}
</style>
</head>

<body>

<div class="universe" id="universe">

  <div class="portal">
    <div class="ring"></div>
    <div class="ring two"></div>
    <div class="ring three"></div>
    <div class="core"></div>
  </div>

  <div class="content">
    <h1>GALAXY</h1>
    <p>EXPLORE THE UNIVERSE</p>
  </div>

</div>

<script>
// GENERAR ESTRELLAS
const universe = document.getElementById("universe");

for (let i = 0; i < 150; i++) {
  const star = document.createElement("div");

  star.className = "star";
  star.style.left = Math.random() * 100 + "%";
  star.style.top = Math.random() * 100 + "%";

  const size = Math.random() * 3 + 1;
  star.style.width = size + "px";
  star.style.height = size + "px";

  star.style.animationDelay = Math.random() * 3 + "s";
  star.style.animationDuration =
    Math.random() * 3 + 1 + "s";

  universe.appendChild(star);
}

// GENERAR METEORITOS
function createMeteor() {
  const meteor = document.createElement("div");

  meteor.className = "meteor";
  meteor.style.left = Math.random() * 90 + "%";
  meteor.style.top = Math.random() * 50 + "%";

  universe.appendChild(meteor);

  setTimeout(() => {
    meteor.remove();
  }, 2000);
}

setInterval(createMeteor, 1200);
</script>

</body>
</html>
